name: Android prerelease

# Builds the Release APK, signs it and publishes it as a GitHub prerelease.
# Prereleases come only from `develop`; stable releases come from `main` (android-release.yml).
# It never runs for pull requests, so no pull request can publish a binary.
on:
  push:
    branches: [develop]
    paths: ['android/**', 'App/Localizable.xcstrings', '.github/workflows/android-prerelease.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A manual run from any other branch must not publish a prerelease.
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # create the tag and the prerelease; nothing else is granted
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Stop if this version is already released
        id: released
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already a stable release; no prerelease needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build the Release APK
        if: steps.released.outputs.skip != 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Sign
        if: steps.released.outputs.skip != 'true'
        id: sign
        working-directory: android
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          name="Pulso-android-${version}-pre.${GITHUB_RUN_NUMBER}.apk"
          ./scripts/sign_prerelease.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/$name"
          echo "apk=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${version}-pre.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        if: steps.released.outputs.skip != 'true'
        env:
          APK: ${{ steps.sign.outputs.apk }}
          TAG: ${{ steps.sign.outputs.tag }}
        run: |
          signing="a throwaway key (it cannot update an install signed by another key)"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then signing="the repository release key"; fi
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Pulso Android $TAG" \
            --notes "Automatic Android prerelease built from $GITHUB_SHA and signed with $signing. Not a Play Store build; Wear OS is not included. Personal, noncommercial use under the repository LICENSE."
