name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          python3 scripts/generate_project.py

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Pulso.xcodeproj -scheme Pulso \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=latest' \
            -testLanguage es -testRegion ES \
            -derivedDataPath "$RUNNER_TEMP/PulsoDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:PulsoTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            test

      - name: Verify Release excludes demo mode
        run: |
          xcodebuild \
            -project Pulso.xcodeproj -scheme Pulso \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=latest' \
            -testLanguage es -testRegion ES \
            -derivedDataPath "$RUNNER_TEMP/PulsoDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:PulsoUITests/DashboardTests/testReleaseBuildIgnoresDemoAndResetArguments \
            -resultBundlePath TestResults/ReleaseDemo.xcresult \
            ENABLE_TESTABILITY=YES \
            test

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7
